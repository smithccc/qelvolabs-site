<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triple Track — Qelvo Labs</title>
<meta name="description" content="Triple Track — weight, diet and workouts in one place.">
<style>
:root{--bg:#fafafa;--fg:#18181b;--muted:#52525b;--line:#e4e4e7;--accent:#047857}
@media (prefers-color-scheme: dark){:root{--bg:#0a0a0b;--fg:#fafafa;--muted:#a1a1aa;--line:#27272a;--accent:#34d399}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Helvetica Neue",sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 20px 80px}
header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}
.brand{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand a{color:var(--muted);text-decoration:none}
h1{font-size:28px;line-height:1.3;margin:6px 0 8px;letter-spacing:-.02em}
h2{font-size:18px;margin:32px 0 8px}
.meta{color:var(--muted);font-size:14px;margin:0}
.muted{color:var(--muted)}
a{color:var(--accent)}
ul{padding-left:20px}
.badge{display:inline-block;font-size:13px;padding:2px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:56px;padding-top:16px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><a href="/">Qelvo Labs</a></div>
  <h1>Triple Track</h1>
  <p class="meta">체중 · 식단 · 운동을 한 곳에서 기록합니다.<br>Track your weight, diet and workouts in one place.</p>
</header>

<p><span class="badge">App Store — 곧 출시 / Coming soon</span></p>
<!-- 출시 후 위 배지를 교체: <a href="[APP_STORE_URL]">App Store에서 다운로드 / Download on the App Store</a> -->

<h2>개인정보 / Privacy</h2>
<p><a href="/tripletrack/privacy/">개인정보처리방침 / Privacy Policy</a></p>

<h2>문의 / Contact</h2>
<p><a href="mailto:support@qelvolabs.com?subject=Triple%20Track">support@qelvolabs.com</a></p>

<footer>© Qelvo Labs</footer>
</main>
</body>
</html>
